<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="header-title">
        <h1>🚜 {{ title }}</h1>
      </div>
      <div class="connection-status" *ngIf="connectionState$ | async as connectionState"
           [ngClass]="getConnectionStatusClass(connectionState)">
        {{ getConnectionStatusText(connectionState) }}
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <div class="container">
      
      <!-- Forklift Animation -->
      <section class="animation-section" *ngIf="missionState$ | async as missionState">
        <app-forklift-animation [missionState]="missionState"></app-forklift-animation>
      </section>

      <!-- Current Mission Highlight -->
      <section class="current-mission-section" *ngIf="currentMission$ | async as currentMission">
        <div class="section-header">
          <h2>🎯 Missione Corrente</h2>
        </div>
        <app-mission-list
          [missions]="[currentMission]"
          [title]="'Missione Attiva'"
          (missionAction)="onMissionAction($event)">
        </app-mission-list>
      </section>

      <!-- No Current Mission -->
      <section class="idle-section" *ngIf="!(currentMission$ | async)">
        <div class="idle-message">
          <div class="idle-icon">😴</div>
          <h3>Nessuna Missione Attiva</h3>
          <p>Seleziona una missione assegnata per iniziare, o prendi una missione disponibile!</p>
        </div>
      </section>

      <!-- My Missions -->
      <section class="missions-section" *ngIf="myMissions$ | async as myMissions">
        <app-mission-list
          [missions]="myMissions"
          [title]="'🎯 Le Mie Missioni'"
          [emptyMessage]="'Nessuna missione assegnata. Ottimo lavoro! 🎉'"
          (missionAction)="onMissionAction($event)">
        </app-mission-list>
      </section>

      <!-- Available Missions -->
      <section class="missions-section" *ngIf="availableMissions$ | async as availableMissions">
        <app-mission-list
          [missions]="availableMissions"
          [title]="'📋 Missioni Disponibili'"
          [emptyMessage]="'Tutte le missioni sono state assegnate! 🚀'"
          (missionAction)="onMissionAction($event)">
        </app-mission-list>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>Dashboard Mulettista v1.0 - Ottimizzato per tablet</p>
  </footer>
</div>
